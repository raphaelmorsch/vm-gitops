apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: vm-gitops-spokes
  namespace: vm-gitops
spec:
  predicates:
  - requiredClusterSelector:
      labelSelector:
        matchExpressions:
        - key: name
          operator: In
          values:
          - cluster-sno-sp
          - cluster-sno-us
  tolerations:
  - key: cluster.open-cluster-management.io/unreachable
    operator: Exists
  - key: cluster.open-cluster-management.io/unavailable
    operator: Exists
